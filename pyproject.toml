[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "security-threat-analyzer"
version = "0.1.0"
description = "Serverless, event-driven security monitoring platform on AWS"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = []